<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TS Safe Version</title>
  <link rel="stylesheet" href="style.css" />
  <script src="dist/main.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Final Price Calculator</h1>
    <p class="description">Safe TypeScript version</p>

    <form>
      <label for="price">Input Price</label>
      <input id="price" name="price" type="text" placeholder="Example: 100" />
      <button type="submit">Calculate</button>
    </form>

    <p id="final-price" class="result">Final Price: -</p>
  </main>
</body>
</html>
